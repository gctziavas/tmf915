services:

  # ── MySQL ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: letmein
      MYSQL_DATABASE: aim915db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pletmein"]
      interval: 10s
      timeout: 5s
      retries: 10
      # First start initialises the data directory, which can take a few minutes on a fresh
      # machine. Failures during start_period do not count, so MySQL is not marked unhealthy
      # (which would stop Keycloak and the API from ever starting) before it is ready.
      start_period: 180s

  # ── Keycloak ───────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    restart: unless-stopped
    command:
      - start-dev
      - --http-relative-path=/auth
      - --import-realm
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?createDatabaseIfNotExist=true
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: letmein
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: kcadmin
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/openslice-realm.json:/opt/keycloak/data/import/openslice-realm.json:ro
    depends_on:
      mysql:
        condition: service_healthy

  # ── TMF 915 AI Management API ─────────────────────────────────────
  # MLflow and MinIO can be run externally or locally via profiles.
  tmf915:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # ── Spring profile ──
      SPRING_PROFILES_ACTIVE: docker
      # ── Database ──
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aim915db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: letmein
      # ── Keycloak / OAuth2 ──
      # Tokens are accepted only if their issuer equals this exactly, and Keycloak sets the issuer
      # from the address it was called on. Set KEYCLOAK_ISSUER_URI if clients get tokens from
      # another address than localhost (e.g. http://my-server:8080/auth/realms/openslice).
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8080/auth/realms/openslice}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8080/auth/realms/openslice}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/openslice/protocol/openid-connect/certs
      # ── MLflow: defaults to the 'full' profile's services; set both for an external MLflow ──
      MLFLOW_ENABLED: "true"
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      MLFLOW_S3_ACCESS_KEY: minioadmin
      MLFLOW_S3_SECRET_KEY: minioadmin
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_SYNC_ENABLED: "true"
      # ── Deployment URI exposed via env (maps to aimodel.deployment.serving-base-url) ──
      AIMODEL_DEPLOYMENT_SERVING_BASE_URL: ${AIMODEL_DEPLOYMENT_SERVING_BASE_URL:-}
      # ── Model downloads (aimodel.artifacts.*; see docs/USER_GUIDE.md section 8) ──
      AIMODEL_ARTIFACTS_ALLOWED_LOCATIONS: ${AIMODEL_ARTIFACTS_ALLOWED_LOCATIONS:-s3://mlflow/}
      AIMODEL_ARTIFACTS_MAX_DOWNLOAD_BYTES: ${AIMODEL_ARTIFACTS_MAX_DOWNLOAD_BYTES:-2147483648}
      AIMODEL_ARTIFACTS_DOWNLOAD_TIMEOUT: ${AIMODEL_ARTIFACTS_DOWNLOAD_TIMEOUT:-15m}
      # ── Docker: connect to host Docker daemon ──
      MLFLOW_DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "13082:13082"
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:13082/tmf-api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ── MinIO (Optional - 'full' profile) ─────────────────────────────
  minio:
    # MinIO no longer publishes images on Docker Hub or quay.io. These are unmodified mirrors of
    # the last official builds (linux/amd64 only), from source github.com/minio/minio at commit
    # 07c3a429bfed433e49018cb0f78a52145d4bedeb (AGPL-3.0).
    image: gtziavas/minio-mirror:RELEASE.2025-09-07T16-13-09Z
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # ── MinIO bucket for MLflow (Optional - 'full' profile) ───────────
  # One-shot: waits for MinIO, creates the 'mlflow' bucket the mlflow service stores artifacts
  # in (s3://mlflow/), then exits. Safe to re-run.
  minio-init:
    # Mirror of minio/mc, source github.com/minio/mc at commit 7394ce0dd2a80935aded936b09fa12cbb3cb8096
    # (AGPL-3.0). See the note on the minio service.
    image: gtziavas/mc-mirror:RELEASE.2025-08-13T08-35-41Z
    profiles: ["full"]
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          echo "waiting for MinIO"; sleep 2
        done
        mc mb --ignore-existing local/mlflow
    restart: "no"

  # ── MLflow (Optional - 'full' profile) ────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    # --allowed-hosts: MLflow 3 rejects requests whose Host header is not allowed (DNS-rebinding
    # protection; the default only allows localhost and private IPs). The API reaches it as
    # "mlflow:5000"; training scripts and browsers on the host use localhost.
    command: >-
      mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://mlflow/ --host 0.0.0.0
      --allowed-hosts "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  mysql-data:
  minio-data:
