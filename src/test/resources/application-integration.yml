spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost

mlflow:
  enabled: true
  # Integration tests need a real MLflow, MinIO and Docker daemon. Point them at yours with
  # TMF915_IT_MLFLOW_URI, TMF915_IT_S3_URL and TMF915_IT_DOCKER_HOST.
  tracking-uri: "${TMF915_IT_MLFLOW_URI:http://localhost:5000}"
  connection-timeout: 30000
  read-timeout: 60000
  s3-endpoint-url: "${TMF915_IT_S3_URL:http://localhost:9010}"
  s3-access-key: "minioadmin"
  s3-secret-key: "minioadmin"
  sync:
    enabled: false
    interval-ms: 60000
    base-url: ""
  docker:
    host: "${TMF915_IT_DOCKER_HOST:unix:///var/run/docker.sock}"
    container-port: 8080
    host-port-start: 5100
    host-port-end: 5200
    env-manager: "local"
    command-timeout-seconds: 60

logging:
  level:
    org.etsi.osl.controllers.tmf915: DEBUG
