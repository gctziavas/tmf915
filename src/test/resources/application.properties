# Test overrides, layered on top of src/main/resources/application.yml.
#
# This must stay a .properties file: a src/test/resources/application.yml would shadow the main
# application.yml on the classpath (tests would silently run without production settings such
# as open-in-view, JSON null handling and compression). A .properties file is loaded in
# addition to the main YAML and takes precedence over it.
#
# Profile files such as application-integration.yml are applied on top of both.

# In-memory database instead of MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# No MLflow during tests: the MLflow integration is switched off entirely, which is also the
# supported way to run the API without MLflow. Tests that exercise MLflow beans enable it
# themselves (see AiModelListHttpTest).
mlflow.enabled=false
mlflow.sync.enabled=false
