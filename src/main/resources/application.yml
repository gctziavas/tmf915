server:
  port: 13082
  servlet:
    context-path: /tmf-api
  # gzip responses for clients that send Accept-Encoding: gzip (browsers, Postman, curl and
  # HTTP libraries do by default). The JSON clients receive is unchanged.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain,text/html,text/css,application/javascript
    min-response-size: 1KB
  ssl:
    enabled: false

openapi:
  aiManagement:
    base-path: /AiM/v4

springdoc:
  version: '@springdoc.version@'
  writer-with-default-pretty-printer: true
  swagger-ui:
    display-request-duration: true
    groups-order: ASC
    operationsSorter: method
    disable-swagger-default-url: true
    use-root-path: true
    oauth:
      client-id: osapiWebClientId
      use-pkce-with-authorization-code-grant: false
  oAuthFlow:
    authorizationUrl: http://localhost:8080/auth/realms/openslice/protocol/openid-connect/auth
    tokenUrl: http://localhost:8080/auth/realms/openslice/protocol/openid-connect/token

spring:
  web:
    error:
      # Exception messages stay out of error responses: an unexpected exception can carry SQL or
      # Docker output. Expected errors (400s from the API) set their own response body. Which
      # request fields failed validation is shown, so a client can tell why it got 400.
      include-message: never
      include-binding-errors: always
  ai:
    mcp:
      server:
        name: tmf915-ai-catalog-mcp
        version: 1.0.0
  application:
    name: openslice-aim915-api
  datasource:
    url: jdbc:mysql://localhost:3306/aim915db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: letmein
    hikari:
      minimumIdle: 2
      maximumPoolSize: 20
      idleTimeout: 20000
      connectionTimeout: 40000
  jpa:
    # Off: requests do not hold a DB connection while the response is written. Repository
    # services load everything the response needs inside their own transactions.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    generate-ddl: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart.max-file-size: 10MB
    multipart.max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/auth/realms/openslice
          jwk-set-uri: http://keycloak:8080/auth/realms/openslice/protocol/openid-connect/certs
  jackson:
    date-format: org.etsi.osl.controllers.tmf915.RFC3339DateFormat
    # Leave out "field": null entries from REST responses.
    default-property-inclusion: non_null
logging:
  level:
    root: INFO
    portal.api: INFO
    org.etsi.osl.controllers.tmf915: DEBUG
    org.springframework: INFO
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
    file: "%d %p %c{1.} [%t] %m%n"

mlflow: # MLflow configuration for AIM915 model management
  enabled: true
  tracking-uri: "http://127.0.0.1:5000"
  connection-timeout: 30000 #ms
  read-timeout: 60000 #ms
  # S3/MinIO artifact storage (set if MLflow uses S3-compatible storage)
  s3-endpoint-url: ""
  s3-access-key: ""
  s3-secret-key: ""
  sync: # Periodic sync of MLflow models to TMF 915 AiModelSpecifications
    enabled: true
    interval-ms: 60000 # 1 minute
    # Every full-interval-ms all logged models are fetched; in between, only models created since
    # the last search (if the MLflow server supports the creation_time filter).
    full-interval-ms: 600000 # 10 minutes
    base-url: "" # Base URL for artifact endpoints (empty = auto from server config)
  docker: # Docker deployment configuration
    # Docker daemon host URI (e.g., tcp://10.0.0.1:2375). Empty = local Docker.
    host: ""
    # Other Docker daemons clients may name in an AiModel's dockerHost characteristic,
    # comma-separated. mlflow.docker.host is always allowed; any other value is rejected (400).
    allowed-hosts: ""
    # Container port that MLflow model serves on
    container-port: 8080
    # Host port range to scan for available ports (inclusive)
    host-port-start: 3000
    host-port-end: 7000
    # Environment manager for mlflow models build-docker (local, virtualenv, uv)
    env-manager: "local"
    # Timeout in seconds for docker run command
    command-timeout-seconds: 30

hub: # TMF Hub event notifications (webhooks to subscribers)
  webhook:
    # Off by default: no notifications are sent. Subscriptions can still be registered through
    # the hub API (a warning is logged). Set to true to deliver events to subscribers.
    enabled: false
    connect-timeout: 2s # max time to open a connection to a subscriber
    read-timeout: 5s    # max time to wait for a subscriber's response
    threads: 4          # deliveries to different subscribers run in parallel
    queue-capacity: 1000 # pending deliveries; beyond this, notifications are dropped with a warning

aimodel: # AIM915 model management configuration
  deployment:
    # Public base URL of model endpoints on the default Docker host (mlflow.docker.host).
    # Empty: endpoints use the Docker host's address (localhost for a local socket, which only
    # works on that machine). Either a base such as http://models.example.com (":<port>" is
    # appended) or a template with {port}, e.g. https://gateway.example.com/models/{port}.
    # Deployments on another dockerHost keep that host's address.
    serving-base-url: ""
  specification:
    default-lifecycle-status: "Active"
  artifacts: # Model downloads: GET /aiModelSpecification/{id}/artifacts (needs the S3 settings above)
    # Storage locations downloads may read, comma-separated. Anything else is refused (404), also
    # for specifications created with POST that point elsewhere. Whole path segments are matched.
    allowed-locations: "s3://mlflow/"
    max-download-bytes: 2147483648 # 2 GB; larger models are refused (413) and not advertised
    # Longest time one download may take; then it is cut off, so slow clients do not hold
    # connections and storage streams open.
    download-timeout: 15m
    # After startup, add the download attachment to downloadable specifications that lack it.
    backfill-on-startup: true

---
# ── Docker Compose profile ──────────────────────────────────────────
# Activated by SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml).
# Environment variables in docker-compose.yml override datasource, Keycloak,
# and MLflow URLs so that services resolve via Docker DNS names.
spring:
  config:
    activate:
      on-profile: "docker"
  datasource:
    url: jdbc:mysql://mysql:3306/aim915db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: letmein
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/auth/realms/openslice/protocol/openid-connect/certs

keycloak:
  issuer-uri: http://localhost:8080/auth/realms/openslice

mlflow:
  # The 'full' Compose profile's services; docker-compose.yml can override both.
  tracking-uri: "http://mlflow:5000"
  s3-endpoint-url: "http://minio:9000"
  s3-access-key: "minioadmin"
  s3-secret-key: "minioadmin"
  docker:
    host: "unix:///var/run/docker.sock"
